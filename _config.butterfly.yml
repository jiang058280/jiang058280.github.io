# Butterfly 主题覆盖配置
# 只把需要自定义的项写在这里即可覆盖主题默认值
# 完整配置项文档: https://butterfly.js.org

# 顶部导航栏：不显示站点标题（桌面端整条顶栏隐藏，见 custom.css）
nav:
  display_title: false

# 导航菜单（左侧导航坞由此生成）——「文章」为可展开的父菜单
menu:
  首页: / || fas fa-house
  文章||fas fa-file-lines:
    分类: /categories/ || fas fa-folder
    标签: /tags/ || fas fa-tag
  公告: /announcement/ || fas fa-bell
  个人简介: /about/ || fas fa-user

# 自定义样式与脚本注入（不改主题源码，升级主题不受影响）
# 新版使用独立 guofeng 文件；旧 custom 文件保留但不再注入。
# 修改资源后同步更新 v= 版本号。
inject:
  head:
    - <script src="/js/guofeng-theme.js?v=20260916i"></script>
    - <link rel="stylesheet" href="/css/guofeng.css?v=20260916a">
    - <link rel="stylesheet" href="/css/guofeng-refinements.css?v=20260916e">
    - <link rel="stylesheet" href="/css/guofeng-light.css?v=20260916i">
    - <link rel="stylesheet" href="/css/guofeng-content.css?v=20260916k">
    - <link rel="stylesheet" href="/css/guofeng-reading-layout.css?v=20260916l">
    - <link rel="stylesheet" href="/css/guofeng-navigation.css?v=20260916n">
  bottom:
    - <script src="/js/guofeng.js?v=20260916n"></script>

# pjax 局部刷新：切换页面只替换内容区，不整页重载
pjax:
  enable: true

# 由新版主题管理器控制明暗，避免系统主题监听覆盖页面默认。
darkmode:
  enable: true
  button: false
  autoChangeMode: false

# instant.page 悬停预取：鼠标悬停菜单即预先加载目标页
instantpage: true

# 第一版无需外部分享脚本，避免额外 CDN 请求。
share:
  use: false

# 关闭不蒜子统计（减少一个外部脚本依赖）
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 第三方资源自托管（全部指向项目内文件，不再依赖国外 CDN）
CDN:
  option:
    fontawesome: /css/fontawesome/all.min.css
    egjs_infinitegrid: /js/infinitegrid.min.js
    instantpage: /js/instantpage.js
    pjax: /js/pjax.min.js

# 作者头像（侧边栏作者卡片）
avatar:
  img: /img/avatar.png
  effect: false

# 顶部横幅：已按要求全部禁用（disable_top_img 优先级最高）
disable_top_img: true

# 首页副标题打字机效果
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 把想法写成文字，把时间变成文章。
    - 记录技术与生活。
    - 欢迎来到 LGQ 的一方天地。

# 站点副标题打字机效果
# 文章卡片布局: 3 = 封面左右交替
index_layout: 3

# 页脚：版权行与框架信息行全部关闭
footer:
  owner:
    enable: false
  copyright:
    enable: false

# 侧边栏：右侧不再放任何卡片，内容全部由左侧导航坞承载
aside:
  card_announcement:
    enable: false
  card_recent_post:
    enable: false
  card_categories:
    enable: false
  card_tags:
    enable: false
  card_archives:
    enable: false
  card_webinfo:
    enable: false
  card_author:
    button:
      enable: false
